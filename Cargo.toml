[package]
name = "aien-edge"
version = "0.1.0"
edition = "2021"
description = "Native Rust edge server for AIEN static sites: in-memory precompressed assets, virtual hosts, and automatic Let's Encrypt TLS"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-dev/aien-edge"

[dependencies]
arc-swap = "1"
blake3 = "1"
brotli = "8"
bytes = "1"
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
mime_guess = "2"
rustls-acme = { version = "0.15.4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
